<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Compra — Compras Públicas</title>

    <!-- Vendorizado localmente (js/vendor/tailwindcss.js) pra rodar sem internet — mesmo
         runtime da Play CDN, só que servido do disco em vez de cdn.tailwindcss.com. -->
    <script src="js/vendor/tailwindcss.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              accent: {
                DEFAULT: "#4a274f",
                50: "#f6f4f6",
                100: "#ede9ed",
                200: "#d2c9d3",
                300: "#b7a9b9",
                400: "#806884",
                500: "#4a274f",
                600: "#3f2143",
                700: "#341b37",
                800: "#29152b",
                900: "#1e1020",
              },
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/nova-compra.css" />
  </head>
  <body class="flex h-full flex-col bg-white text-zinc-900 antialiased">
    <!-- Cabeçalho -->
    <header class="flex shrink-0 items-center gap-3 border-b border-zinc-200 bg-white px-5 py-3">
      <img src="img/aprova-wordmark-dark.svg" alt="Aprova" class="h-6 w-auto shrink-0" />

      <button
        id="btn-salvar"
        type="button"
        class="ml-auto shrink-0 rounded-lg bg-accent px-4 py-2 text-sm font-medium text-white transition hover:bg-accent-600"
      >
        Salvar
      </button>
    </header>

    <!-- Corpo: editor + régua -->
    <div class="flex min-h-0 flex-1">
      <!-- Editor de blocos -->
      <main class="min-w-0 flex-1 overflow-y-auto">
        <div class="mx-auto max-w-3xl px-10 py-10">
          <div id="editor-blocks" class="space-y-1"></div>

          <div id="add-block-wrapper" class="relative mt-2">
            <button
              id="btn-add-block"
              type="button"
              class="flex items-center gap-2 rounded-lg border border-dashed border-zinc-300 px-3 py-2 text-sm text-zinc-500 transition hover:border-accent hover:text-accent"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14" />
              </svg>
              Adicionar bloco
            </button>

            <div
              id="add-block-menu"
              class="hidden absolute left-0 top-full z-20 mt-1 w-44 rounded-lg border border-zinc-200 bg-white py-1 shadow-lg"
            >
              <button type="button" data-tipo="texto" class="add-block-opcao flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-zinc-700 hover:bg-zinc-50">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
                Texto
              </button>
              <button type="button" data-tipo="imagem" class="add-block-opcao flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-zinc-700 hover:bg-zinc-50">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                Imagem
              </button>
              <button type="button" data-tipo="tabela" class="add-block-opcao flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-zinc-700 hover:bg-zinc-50">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
                Tabela
              </button>
            </div>
          </div>
        </div>
      </main>

      <!-- Régua validadora -->
      <aside class="w-[30%] shrink-0 overflow-y-auto border-l border-zinc-200 bg-zinc-50">
        <div class="px-6 py-8">
          <p id="regua-resumo" class="mt-1 text-sm font-semibold text-zinc-900"></p>

          <div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-zinc-200">
            <div id="regua-progresso" class="h-full rounded-full bg-accent transition-all"></div>
          </div>

          <ul id="regua-lista" class="mt-5 space-y-2"></ul>
        </div>
      </aside>
    </div>

    <!-- Toast simples de feedback -->
    <div id="toast" class="pointer-events-none fixed bottom-6 left-6 z-50 translate-y-2 rounded-lg bg-zinc-900 px-4 py-2.5 text-sm text-white opacity-0 shadow-lg transition"></div>

    <script src="js/nova-compra.js"></script>
  </body>
</html>
